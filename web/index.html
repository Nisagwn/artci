<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Artçı · Canlı Deprem Haritası</title>
  <meta name="description" content="Türkiye'deki son depremlerin AFAD, Kandilli ve EMSC verileriyle birleştirilmiş canlı haritası. Eğitim projesidir.">
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip" href="#list">Deprem listesine geç</a>

  <header class="bar">
    <div class="brand">
      <h1>Artçı</h1>
      <p class="sub">Türkiye ve çevresindeki son depremler</p>
    </div>
    <p class="status" id="status" role="status" data-state="connecting">
      <span class="dot" aria-hidden="true"></span><span id="status-text">Bağlanıyor…</span>
    </p>
  </header>

  <div class="notice" role="note">
    <strong>Artçı bir eğitim projesidir; resmî bir uyarı sistemi değildir.</strong>
    Resmî bilgi için <a href="https://deprem.afad.gov.tr/" rel="noopener" target="_blank">AFAD</a>'ı takip edin.
  </div>

  <main class="layout">
    <div id="map" class="map" role="region" aria-label="Deprem haritası"></div>

    <aside class="panel" aria-labelledby="list-title">
      <div class="overview">
        <h2 id="list-title"><span id="count">0</span> deprem <span class="muted" id="window-label">son 24 saatte</span></h2>
        <button type="button" class="biggest" id="biggest" hidden></button>
      </div>

      <div class="controls">
        <label class="search">
          <span class="sr-only">Yer ara</span>
          <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input type="search" id="search" placeholder="Yer ara: il, ilçe… (ör. Manisa)" autocomplete="off" spellcheck="false">
          <kbd aria-hidden="true">/</kbd>
        </label>

        <div class="filter" id="f-hours" role="group" aria-labelledby="l-hours">
          <span id="l-hours">Zaman</span>
          <button type="button" data-v="1" aria-pressed="false">1 saat</button>
          <button type="button" data-v="24" aria-pressed="true">24 saat</button>
          <button type="button" data-v="168" aria-pressed="false">7 gün</button>
        </div>

        <div class="filter" id="f-mag" role="group" aria-labelledby="l-mag">
          <span id="l-mag">Büyüklük</span>
          <button type="button" data-v="0" aria-pressed="true">Tümü</button>
          <button type="button" data-v="2" aria-pressed="false">2+</button>
          <button type="button" data-v="3" aria-pressed="false">3+</button>
          <button type="button" data-v="4" aria-pressed="false">4+</button>
        </div>

        <div class="filter" id="f-sort" role="group" aria-labelledby="l-sort">
          <span id="l-sort">Sırala</span>
          <button type="button" data-v="time" aria-pressed="true">En yeni</button>
          <button type="button" data-v="mag" aria-pressed="false">En büyük</button>
        </div>
      </div>

      <ul id="list" class="list" tabindex="-1" aria-live="polite" aria-relevant="additions"></ul>
      <p id="empty" class="empty" hidden></p>

      <p class="credits">
        Veri: AFAD, Kandilli Rasathanesi, EMSC · Saatler Türkiye saatiyle.
      </p>
    </aside>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
