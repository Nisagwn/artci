<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Artçı · Canlı Deprem Haritası</title>
  <meta name="description" content="Türkiye'deki son depremlerin AFAD, Kandilli ve EMSC verileriyle birleştirilmiş canlı haritası. Eğitim projesidir.">
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip" href="#list">Deprem listesine geç</a>

  <header class="bar">
    <div class="brand">
      <h1>Artçı</h1>
      <p class="sub">Türkiye ve çevresindeki son depremler</p>
    </div>
    <p class="status" id="status" role="status" data-state="connecting">
      <span class="dot" aria-hidden="true"></span><span id="status-text">Bağlanıyor…</span>
    </p>
  </header>

  <div class="notice" role="note">
    <strong>Artçı bir eğitim projesidir; resmî bir uyarı sistemi değildir.</strong>
    Resmî bilgi için <a href="https://deprem.afad.gov.tr/" rel="noopener" target="_blank">AFAD</a>'ı takip edin.
  </div>

  <main class="layout">
    <div id="map" class="map" role="region" aria-label="Deprem haritası"></div>

    <aside class="panel" aria-labelledby="list-title">
      <h2 id="list-title" class="sr-only">Deprem listesi</h2>
      <div class="controls">
        <label class="search">
          <span class="sr-only">Yer ara</span>
          <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input type="search" id="search" placeholder="Yer ara (ör. Manisa)" autocomplete="off" spellcheck="false">
        </label>

        <div class="selects">
          <label><span class="sr-only">Zaman aralığı</span>
            <select id="f-hours">
              <option value="1">1 saat</option>
              <option value="24" selected>24 saat</option>
              <option value="168">7 gün</option>
            </select>
          </label>
          <label><span class="sr-only">En az büyüklük</span>
            <select id="f-mag">
              <option value="0" selected>Her büyüklük</option>
              <option value="2">2 ve üstü</option>
              <option value="3">3 ve üstü</option>
              <option value="4">4 ve üstü</option>
            </select>
          </label>
          <label><span class="sr-only">Sıralama</span>
            <select id="f-sort">
              <option value="time" selected>En yeni</option>
              <option value="mag">En büyük</option>
            </select>
          </label>
        </div>

        <p class="summary-line" aria-live="off">
          <span id="count">0</span> deprem<span id="biggest-wrap" hidden> · en büyüğü <button type="button" class="biggest" id="biggest"></button></span>
        </p>
      </div>

      <ul id="list" class="list" tabindex="-1" aria-live="polite" aria-relevant="additions"></ul>
      <p id="empty" class="empty" hidden></p>

      <p class="credits">Veri: AFAD, Kandilli, EMSC · Türkiye saati</p>
    </aside>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
