global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: artci
    static_configs:
      - targets: ["ingest-afad:9111"]
        labels: { service: ingest-afad }
      - targets: ["ingest-kandilli:9112"]
        labels: { service: ingest-kandilli }
      - targets: ["ingest-emsc:9113"]
        labels: { service: ingest-emsc }
      - targets: ["merger:9102"]
        labels: { service: merger }
      - targets: ["notifier:9103"]
        labels: { service: notifier }
      - targets: ["summarizer:9104"]
        labels: { service: summarizer }
      - targets: ["api:9105"]
        labels: { service: api }
