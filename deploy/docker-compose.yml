# Canlı kurulum (Plan §14, §16 gün 21): tek sunucuda tüm hat.
#
#   cp deploy/.env.example deploy/.env   # alan adı, parolalar, anahtarlar
#   docker build -t artci:latest .       # imaj bir kez (make up ikisini birden yapar)
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --no-build --wait
#
# Uygulama servisleri aynı artci:latest imajını paylaşır; `up --build` onları
# eşzamanlı derler ve Docker Desktop'ta "image already exists" ile düşebilir.
#
# Dışarıya yalnızca Caddy (80/443) açılır. Grafana ve Prometheus yalnızca
# sunucunun kendisinden erişilebilir (SSH tüneli: ssh -L 3000:localhost:3000 ...).
name: artci

x-app: &app
  build: { context: .., dockerfile: Dockerfile }
  image: artci:latest
  restart: unless-stopped
  environment: &env
    ARTCI_POSTGRES_DSN: postgres://artci:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}@postgres:5432/artci?sslmode=disable
    ARTCI_REDIS_ADDR: redis:6379
    ARTCI_USER_AGENT: ${ARTCI_USER_AGENT:-}
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  # SIGTERM'den sonra eldeki işi bitirmek için süre (graceful shutdown).
  stop_grace_period: 20s
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: artci
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}
      POSTGRES_DB: artci
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artci"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF: yeniden başlamada akışlar ve consumer group'lar kaybolmasın.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  # merger, notifier ve summarizer açılışta migration çalıştırır;
  # eşzamanlı başlamaları güvenlidir (pg_advisory_lock, store.Migrate).
  merger:
    <<: *app
    entrypoint: ["/app/merger"]

  ingest-afad:
    <<: *app
    entrypoint: ["/app/ingest", "--source=afad"]
  ingest-kandilli:
    <<: *app
    entrypoint: ["/app/ingest", "--source=kandilli"]
  ingest-emsc:
    <<: *app
    entrypoint: ["/app/ingest", "--source=emsc"]

  notifier:
    <<: *app
    entrypoint: ["/app/notifier"]
    environment:
      <<: *env
      ARTCI_TELEGRAM_TOKEN: ${ARTCI_TELEGRAM_TOKEN:-}

  summarizer:
    <<: *app
    entrypoint: ["/app/summarizer"]
    environment:
      <<: *env
      ARTCI_LLM_API_KEY: ${ARTCI_LLM_API_KEY:-}
      ARTCI_LLM_MODEL: ${ARTCI_LLM_MODEL:-}
      ARTCI_LLM_DAILY_USD: ${ARTCI_LLM_DAILY_USD:-1}

  api:
    <<: *app
    entrypoint: ["/app/api"]
    environment:
      <<: *env
      ARTCI_TELEGRAM_BOT: ${ARTCI_TELEGRAM_BOT:-}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      ARTCI_DOMAIN: ${ARTCI_DOMAIN:?ARTCI_DOMAIN gerekli}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on: [api]

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - promdata:/prometheus
    ports: ["127.0.0.1:9090:9090"]

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD gerekli}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus]

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
  promdata:
  grafanadata:
